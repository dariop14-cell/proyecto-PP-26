<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinTech Dashboard</title>
    <script type="module" src="./main.js"></script>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <header>
        <h1>FinTech Dashboard</h1>
        <p>Tu panel de control financiero</p>
    </header>

    <section id="resumen">
        <h2>Resumen financiero</h2>
        <p>Ingresos: <span id="ingresos">$0</span></p>
        <p>Gastos: <span id="gastos">$0</span></p>
        <p>Balance: <span id="balance">$0</span></p>
    </section>

    <section>
        <h2>Registrar movimientos</h2>
        <form id="form-transaccion">
            <label for="monto">Monto: </label>
            <input type="number" id="monto" required>

            <label for="tipo">Tipo de movimiento:</label>
            <select id="tipo" required>
                <option value="">Seleccionar</option>
                <option value="ingreso">Ingreso</option>
                <option value="gasto">Gasto</option>
            </select>

            <label for="categoria">Categoria: </label>
            <input type="text" id="categoria" placeholder="Sueldo, comida, etc..." required>

            <label for="fecha">Fecha: </label>
            <input type="date" id="fecha" required>

            <label for="descripcion">Descripcion</label>
            <input type="text" id="descripcion" placeholder="descrip. opcional">

            <button type="submit">Agregar movimiento</button>
        </form>
    </section>

    <section id="lista-transacciones">
        <h2>Mis movimientos</h2>
        <ul id="transacciones">

        </ul>
    </section>

    <section id="simulador"> 
        <h2>Simulador de inversiones</h2>

        <form id="form-inversion">
            <label for="capital-inicial">Capital inicial</label>
            <input type="number" id="capital-inicial" min="0" step="0.01" value="50000" required>
            
            <label for="aporte-mensual">Aporte mensual</label>
            <input type="number" id="aporte-mensual" min="0" step="0.01" value="10000" required>

            <label for="tasa-anual">Tasa anual (%):</label>
            <input type="number" id="tasa-anual" min="0" max="100" step="0.01" value="8" required>

            <label for="plazo">Plazo (en años):</label>
            <input type="number" id="plazo" min="1" max="100" step="1" value="10" required>
        
            <button type="submit">Calcular inversion</button>
        </form>

        <div id="resultado-inversion">
            <h3>Proyeccion de tu inversion</h3>
            <p>
                Capital final: 
                <span id="capital-final">$0</span>
            </p>

            <p>
                Aportes totales:
                <span id="aportes-totales">$0</span>
            </p>

            <p>
                Intereses estimados:
                <span id="intereses-estimados">$0</span>
            </p>
        </div>
    </section>
</body>
</html>
